<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Código IA - Profesional</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

    <div id="splash-screen">
        <div class="splash-content">
            <div class="spinner"></div>
            <h2>Plataforma IA</h2>
            <p>Cargando entorno corporativo...</p>
        </div>
    </div>

    <div class="app-container">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Nivel Académico</h2>
                <div class="academic-levels">
                    <button class="btn-level">Veterano</button>
                    <button class="btn-level">TSU</button>
                    <button class="btn-level">Ingeniero</button>
                </div>
            </div>
            
            <button class="btn-new-chat">➕ Iniciar Nuevo Chat</button>
            
            <div class="sidebar-menu">
                <p class="menu-title">📌 CONVERSACIONES FIJAS Y RECIENTES</p>
            </div>
            
            <button class="btn-custom-code">💬 Solicitar Código Personalizado</button>
        </aside>

        <main class="main-content">
            <div class="login-card">
                <div class="login-header">
                    <span class="key-icon">🔑</span>
                    <h1>Iniciar Sesión</h1>
                    <p>Gestiona tu perfil y accede al motor IA</p>
                </div>
                
                <div class="profile-avatar-section">
                    <div class="avatar-placeholder">
                        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Avatar">
                    </div>
                    <button class="btn-change-photo">📷 Cambiar Foto de Perfil</button>
                </div>

                <form action="/login" method="POST" class="login-form">
                    <div class="form-group">
                        <input type="text" name="username" placeholder="Nombre de usuario" required>
                    </div>
                    <div class="form-group">
                        <input type="password" name="password" placeholder="Contraseña" required>
                    </div>
                    <button type="submit" class="btn-submit">Ingresar a la Plataforma</button>
                </form>
            </div>
        </main>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                const splash = document.getElementById("splash-screen");
                splash.style.opacity = "0";
                setTimeout(function() {
                    splash.style.display = "none";
                }, 500);
            }, 2500);
        });
    </script>
</body>
</html>
